services:
  warden-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_warden_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_FILE=/app/data/group_moderator.db
    volumes:
      - bot_data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data:
    driver: local
